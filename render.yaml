services:
  - type: web
    name: bwiza-workbench
    runtime: node
    plan: free
    buildCommand: npm install && npm install --prefix server && npm install --prefix client && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 8787
      - key: GROQ_API_KEY
        sync: false
